<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Inscription</title>
</head>
<body>
    <header>
    </header>
    <main>
        <section id="section1">
            <div>
                <h1>Inscription</h1>
                <p id="paragraphe1">Réservez votre place à un atelier, une <br> conférence, un hackathon ou une <br> rencontre. L'inscription est gratuite.</p>
            </div>
        </section>
        <section>
            <div id="">
                <form action="">
                    <div>
                        <h1>Vos informations</h1>
                        <p>Les champs marqués * sont obligatoires.</p>
                    </div>
                    <div>
                        <label for="nom">Nom *</label>
                        <input type="text" placeholder="Votre nom" required>
                        <label for="prenom">Prénom *</label>
                        <input type="text" placeholder="Votre prenom" required>
                    </div>
                    <div>
                        <label for="email">Adresse e-mail *</label>
                        <input type="email" placeholder="salma@exemple" required>
                        <label for="telephone">Téléphone</label>
                        <input type="tel" placeholder="06 12 34 56 78" required>
                    </div>
                    <div>
                        <label for="événement">Événement choisi *</label>
                        <select name="événement" id="événement" required>
                            <option value="" disabled selected>Choisir un événement</option>
                            <option value="Atelier Flexbox et CSS Grid">Atelier Flexbox et CSS Grid</option>
                            <option value="Accessibilité Web : par où commencer ?">Accessibilité Web : par où commencer ?</option>
                            <option value="Hackathon Green Code">Hackathon Green Code</option>
                            <option value="Rencontre avec des développeurs front-end">Rencontre avec des développeurs front-end</option>
                            <option value="Atelier Git Flow en pratique">Atelier Git Flow en pratique</option>
                            <option value="Du design au code : travailler avec Figma">Du design au code : travailler avec Figma</option>
                        </select>
                    </div>
                    <!-- <div>
                        <p>Niveau *</p>
                        <label for="Débutant">
                            <input type="radio" id="Débutant" name="Niveau" value="Débutant">Débutant
                        </label>
                        <label for="Intermédiaire">
                            <input type="radio" id="Intermédiaire" name="Niveau" value="Intermédiaire">Intermédiaire
                        </label>
                        <label for="Avancé">
                            <input type="radio" id="Avancé" name="Niveau" value="Avancé">Avancé
                        </label>
                    </div> -->
                    <div>
                        <fieldset>
                            <legend>Niveau *</legend>
                            <input type="radio" id="Débutant" name="Niveau" value="Débutant">Débutant
                            <input type="radio" id="Intermédiaire" name="Niveau" value="Intermédiaire">Intermédiaire
                            <input type="radio" id="Avancé" name="Niveau" value="Avancé">Avancé
                        </fieldset>
                    </div>
                    <div>
                        <label for="massage">Message (facultatif)</label>
                        <textarea name="Message" id="Message" placeholder="Vos attentes, vos questions…"></textarea>
                    </div>
                    <div>
                        <input type="checkbox">
                        <label for="">J'accepte que mes données servent <br>à gérer mon inscription. *</label>
                    </div>
                    <div>
                        <button>Valider mon inscription</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <footer>
    </footer>
</body>
</html>
